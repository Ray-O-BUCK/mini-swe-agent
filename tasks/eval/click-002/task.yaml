id: click-002
repo: .cache/repos/click
base_commit: bb695aaecdef95832d167fc1d508921745aa824e
fix_commit: c53d3732b98c764932e146c007146ad402acb229
problem_statement: |
  When an option uses show_envvar=True, an empty envvar should behave like no
  envvar, and a sequence of envvar names should be rendered as a list in both
  help output and missing-option errors. Currently empty or sequence envvars
  produce malformed output. Fix the help and error-hint behavior without
  changing normal string envvars.
test_command: PYTHONPATH=src python -m pytest -q
test_files:
  - tests/test_options.py
  - tests/conftest.py
  - pyproject.toml
fail_to_pass:
  - "tests/test_options.py::test_show_envvar_empty[None-  --units TEXT\\n-envvar1]"
  - "tests/test_options.py::test_show_envvar_empty[None-  --units TEXT\\n-]"
  - "tests/test_options.py::test_show_envvar_empty[WEATHER-  --units TEXT  [env var: WEATHER_UNITS]\\n-envvar1]"
  - "tests/test_options.py::test_show_envvar_empty[WEATHER-  --units TEXT  [env var: WEATHER_UNITS]\\n-]"
  - "tests/test_options.py::test_missing_envvar_sequence[envvar1-'--units' (env var: 'UNITS')]"
  - "tests/test_options.py::test_missing_envvar_sequence[envvar2-'--units' (env var: 'WEATHER_UNITS', 'UNITS')]"
  - "tests/test_options.py::test_missing_envvar_sequence[envvar3-'--units' (env var: 'WEATHER_UNITS', 'UNITS')]"
  - "tests/test_options.py::test_missing_envvar_sequence[envvar4-'--units']"
  - "tests/test_options.py::test_missing_envvar_sequence[-'--units']"
pass_to_pass:
  - tests/test_options.py::test_show_envvar_auto_prefix_dash_in_command
  - tests/test_options.py::test_missing_envvar
  - tests/test_options.py::test_custom_validation
  - tests/test_options.py::test_case_insensitive_choice
hidden:
  test_patch: hidden/test_patch.diff