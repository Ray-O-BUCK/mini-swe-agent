[build-system]
# 构建后端：setuptools + wheel
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-swe-agent"
version = "0.1.0"
description = "从零实现的迷你 SWE-agent，用于学习与评测"
readme = "README.md"
# 本机 orchestrator 用 Python 3.13；代码保持 3.11+ 兼容
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 开发/测试依赖
dev = ["pytest>=8.0"]
# Docker 沙箱依赖（S7 再装）
sandbox = ["docker>=7.0"]

[project.scripts]
sweagent = "sweagent.cli:main"

[tool.setuptools.packages.find]
# 只打包 sweagent 及其子包
include = ["sweagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
